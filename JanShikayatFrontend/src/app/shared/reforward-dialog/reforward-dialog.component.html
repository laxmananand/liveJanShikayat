<div class="fw-backdrop" *ngIf="record as r" (click)="close()">
  <div class="fw-modal rf-modal" role="dialog" aria-modal="true" aria-labelledby="reforwardTitle" (click)="$event.stopPropagation(); openGroup = null">
    <div class="fw-head">
      <div>
        <span class="fw-kicker"><i class="fa-solid fa-share"></i> आवेदन अग्रेषित करें / Forward Application</span>
        <h2 id="reforwardTitle">{{ r.applicationNo || r.id }}</h2>
      </div>
      <button type="button" class="fw-close" (click)="close()" aria-label="बंद करें">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <div class="rf-body">
        <div class="rf-loading" *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> लोड हो रहा है… / Loading…</div>

        <div class="rf-targets" *ngIf="!loading">
          <div *ngFor="let g of groups" class="rf-target">
            <label class="rf-check" [attr.for]="'rf-chk-' + g.officeId">
              <input type="checkbox" [id]="'rf-chk-' + g.officeId" [checked]="g.selected"
                     [disabled]="!available(g).length || submitting" (change)="toggle(g)" />
              {{ g.short }} ({{ g.title }})
              <span class="rf-sent-tag" *ngIf="g.sent.size" [title]="'पहले भेजा गया / Already sent: ' + g.sent.size">
                <i class="fa-solid fa-check"></i> {{ g.sent.size }} भेजा गया
              </span>
            </label>

            <!-- Dropdown with a checklist: several offices of this kind can be picked -->
            <div class="rf-multi" [class.open]="openGroup === g">
              <button type="button" class="rf-input rf-multi-btn" [disabled]="!g.selected || submitting"
                      [class.has-error]="g.selected && !g.picked.length" (click)="toggleList(g, $event)"
                      [attr.aria-expanded]="openGroup === g" [attr.aria-label]="g.subtitle + ' offices'">
                <span>{{ summary(g) }}</span>
                <i class="fa-solid fa-chevron-down"></i>
              </button>

              <ul class="rf-multi-list" *ngIf="openGroup === g" (click)="$event.stopPropagation()">
                <li *ngFor="let o of g.options">
                  <label [class.done]="g.sent.has(o.unitCode)"
                         [title]="g.sent.has(o.unitCode) ? ('भेजा गया ' + (g.sent.get(o.unitCode)!.forwardedAt | date: 'dd-MM-yyyy, hh:mm a')) : ''">
                    <input type="checkbox" [checked]="g.sent.has(o.unitCode) || isPicked(g, o.unitCode)"
                           [disabled]="g.sent.has(o.unitCode)" (change)="pick(g, o.unitCode)" />
                    <span>{{ o.unitLabel }}</span>
                    <small *ngIf="g.sent.has(o.unitCode)"><i class="fa-solid fa-lock"></i> भेजा गया</small>
                  </label>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <span class="fw-error" *ngIf="missingOffice">कृपया चुने गए {{ kindNames }} का कार्यालय चुनें।</span>

        <div class="rf-field" *ngIf="!allSent">
          <label for="rfRemarks">टिप्पणी (वैकल्पिक)</label>
          <textarea id="rfRemarks" name="remarks" rows="3" maxlength="500" [(ngModel)]="remarks" [disabled]="submitting"
                    placeholder="अधिकतम 500 अक्षर"></textarea>
        </div>

        <p class="rf-all-sent" *ngIf="allSent && !loading">
          <i class="fa-solid fa-circle-check"></i> यह आवेदन सभी उपलब्ध {{ kindNames }} कार्यालयों को भेजा जा चुका है।
        </p>

        <span class="fw-error" *ngIf="errorMessage">{{ errorMessage }}</span>
      </div>

      <div class="fw-foot rf-foot">
        <button type="button" class="fw-btn fw-btn-ghost" (click)="close()" [disabled]="submitting">
          {{ allSent ? 'बंद करें / Close' : 'रद्द करें / Cancel' }}
        </button>
        <button *ngIf="!allSent" type="submit" class="fw-btn fw-btn-primary" [disabled]="!canSubmit">
          <i class="fa-solid" [ngClass]="submitting ? 'fa-circle-notch fa-spin' : 'fa-paper-plane'"></i> अग्रेषित करें / Forward
        </button>
      </div>
    </form>
  </div>
</div>
